<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Поставщики — Механика Комфорта</title>
  <link rel="icon" href="logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">К содержанию</a>
  <header class="bar">
    <div class="brand">
      <img src="logo.jpg" alt="" width="96" height="96">
      <span>Механика Комфорта</span>
    </div>
    <input class="nav-toggle" id="nav-toggle" type="checkbox">
    <label class="menu" for="nav-toggle">Меню</label>
    <nav id="crm-nav" aria-label="Разделы">
      <a href="leads.html">Заявки</a>
      <a href="clients.html">Клиенты</a>
      <a href="objects.html">Объекты</a>
      <a href="finance.html">Финансы</a>
      <a href="payroll.html">Зарплаты</a>
      <a href="suppliers.html" aria-current="page">Поставщики</a>
      <a href="pricelist.html">Прайс</a>
      <a href="client-fields.html">Поля</a>
    </nav>
    <button class="btn btn-ghost bar-end" type="button" id="logout">Выйти</button>
  </header>
  <main class="wrap" id="main">
    <div class="page-head">
      <h1 id="title">Поставщики</h1>
      <button class="btn btn-primary" type="button" id="add">Добавить</button>
    </div>
    <p class="banner" id="banner" role="alert" hidden></p>
    <p id="unassigned" hidden></p>
    <div class="table-wrap" id="table-wrap" hidden>
      <table class="leads">
        <caption>Поставщики</caption>
        <thead>
          <tr>
            <th>Поставщик</th>
            <th>Закуплено</th>
            <th>Оплачено</th>
            <th>Долг</th>
            <th>Ближайший срок</th>
            <th>Просрочено</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden><p>Поставщиков пока нет.</p></div>
  </main>
  <dialog id="create">
    <form class="dialog-body" id="create-form">
      <h2>Поставщик</h2>
      <div class="field"><label for="name">Название</label><input id="name" required></div>
      <div class="field"><label for="inn">ИНН</label><input id="inn"></div>
      <div class="field"><label for="phone">Телефон</label><input id="phone" type="tel"></div>
      <p class="note" id="create-status" role="status" hidden></p>
      <div class="dialog-actions">
        <button class="btn btn-primary" type="submit">Сохранить</button>
        <button class="btn" type="button" id="create-close">Закрыть</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="js/suppliers.js"></script>
</body>
</html>
