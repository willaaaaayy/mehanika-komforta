<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ee">
  <title>Вход — Механика Комфорта</title>
  <link rel="icon" href="logo.jpg" type="image/jpeg">
  <meta name="description" content="Вход владельца Механики Комфорта к списку заявок.">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <a class="skip" href="#main">К содержанию</a>
  <header class="rail">
    <a class="logo" href="index.html"><img src="logo.jpg" alt="Механика Комфорта"></a>
    <nav class="site-nav" aria-label="Разделы">
      <a href="index.html#work">Работы</a>
      <a href="index.html#cases">Объекты</a>
      <a href="index.html#why">Подход</a>
      <a href="index.html#request">Заявка</a>
    </nav>
    <a class="login" id="enter" href="#door">Вход</a>
    <button class="login logout" id="logout" type="button" hidden>Выйти</button>
  </header>
  <main class="page" id="main">
    <section class="door" id="door" aria-labelledby="admin-title">
      <p class="kicker">Владелец</p>
      <h1 id="admin-title">Вход</h1>
      <p class="lead">Пароль проверяет сервер. После входа виден список заявок.</p>
      <form id="admin-login">
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
        </div>
        <button type="submit">Войти</button>
        <p class="form-note" id="admin-note" role="status"></p>
      </form>
    </section>

    <section class="crm" id="crm" hidden aria-labelledby="crm-title">
      <div class="list-head">
        <h1 id="crm-title">Заявки</h1>
        <button type="button" id="create-open">Создать</button>
      </div>
      <form id="manual" hidden>
        <div class="field">
          <label for="manual-name">Имя</label>
          <input id="manual-name" required maxlength="80">
        </div>
        <div class="field">
          <label for="manual-phone">Телефон</label>
          <input id="manual-phone" required maxlength="40">
        </div>
        <div class="field">
          <label for="manual-object">Тип объекта</label>
          <input id="manual-object" required maxlength="80">
        </div>
        <button type="submit">Добавить</button>
        <p class="form-note" id="manual-note" role="status"></p>
      </form>
      <div class="list-tools">
        <label>Поиск <input id="query" type="search"></label>
        <label>Этап
          <select id="stage-filter">
            <option value="">Все</option>
          </select>
        </label>
        <label>С <input id="from" type="date"></label>
        <label>По <input id="to" type="date"></label>
      </div>
      <p class="lead" id="empty" hidden>Заявок пока нет.</p>
      <p class="lead" id="none" hidden>Ничего не найдено.</p>
      <div class="table-wrap" id="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Источник</th>
              <th>Дата</th>
              <th>Имя</th>
              <th>Телефон</th>
              <th>Тип объекта</th>
              <th>Этап</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <section class="card" id="prices-box">
        <h2>Расценки</h2>
        <p id="prices-note"></p>
        <input id="prices-file" type="file" accept=".pdf,.xlsx,.xls,.json,application/pdf,application/json">
        <button type="button" id="prices-save">Загрузить прайс</button>
      </section>
      <article class="card" id="card" hidden>
        <header class="card-head">
          <h2 id="card-name"></h2>
          <p id="card-stage"></p>
        </header>
        <form id="card-form">
          <label>Имя <input id="card-name-input" required></label>
          <label>Телефон <input id="card-phone-input" required></label>
          <label>Тип объекта <input id="card-object-input" required></label>
          <p id="card-source"></p>
          <p id="card-date"></p>
          <label>Этап <select id="card-stage-select"></select></label>
          <label>Площадь, м² <input id="card-area" inputmode="decimal"></label>
          <label>Класс
            <select id="card-grade">
              <option value="">Не выбран</option>
              <option value="economy">Эконом</option>
              <option value="standard">Стандарт</option>
              <option value="premium">Премиум</option>
            </select>
          </label>
          <label>Состояние
            <select id="card-condition">
              <option value="new">Новостройка</option>
              <option value="old">Вторичка</option>
            </select>
          </label>
          <label>Состав
            <select id="card-package">
              <option value="paint">Под покраску</option>
              <option value="turnkey">Под ключ без санузлов</option>
            </select>
          </label>
          <div id="card-account" hidden>
            <img id="card-profile" alt="" hidden>
            <label>Имя в Telegram <input id="card-first"></label>
            <label>Фамилия <input id="card-last"></label>
            <label>Имя пользователя <input id="card-username"></label>
            <label>Описание <textarea id="card-bio"></textarea></label>
          </div>
          <p id="card-estimate"></p>
          <button type="submit">Сохранить</button>
        </form>
        <div id="card-photos"></div>
        <button type="button" id="card-close">К списку</button>
      </article>
    </section>
  </main>
  <footer class="foot">
    <p>Механика Комфорта</p>
    <p class="to-site"><a href="index.html">На сайт</a></p>
  </footer>
  <script>
    (function () {
      var stages = [
        ["new", "Новая"],
        ["measure", "Замер"],
        ["contract", "Договор"],
        ["work", "В работе"],
        ["done", "Сдана"],
        ["warranty", "Гарантия"]
      ];
      var sources = { site: "Сайт", telegram: "Telegram", manual: "Вручную" };
      var door = document.getElementById("door");
      var crm = document.getElementById("crm");
      var enter = document.getElementById("enter");
      var logout = document.getElementById("logout");
      var note = document.getElementById("admin-note");

      function csrf() {
        var match = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : "";
      }

      function api(path, options) {
        options = options || {};
        options.credentials = "same-origin";
        options.headers = options.headers || {};
        if (options.method && options.method !== "GET") {
          options.headers["X-XSRF-TOKEN"] = csrf();
          if (options.body) {
            options.headers["Content-Type"] = "application/json";
          }
        }
        return fetch(path, options);
      }

      var logo = document.querySelector(".logo");

      function showDoor() {
        document.body.classList.remove("in-crm");
        logo.setAttribute("href", "index.html");
        door.hidden = false;
        crm.hidden = true;
        enter.hidden = false;
        logout.hidden = true;
        document.title = "Вход — Механика Комфорта";
      }

      function showList() {
        document.body.classList.add("in-crm");
        logo.setAttribute("href", "#");
        door.hidden = true;
        crm.hidden = false;
        enter.hidden = true;
        logout.hidden = false;
        document.title = "Заявки — Механика Комфорта";
        load();
        loadPrices();
      }

      var all = [];
      var openId = null;
      var stageFilter = document.getElementById("stage-filter");
      var cardStage = document.getElementById("card-stage-select");
      stages.forEach(function (pair) {
        stageFilter.append(new Option(pair[1], pair[0]));
        cardStage.append(new Option(pair[1], pair[0]));
      });

      function stageName(code) {
        var found = stages.find(function (pair) { return pair[0] === code; });
        return found ? found[1] : code;
      }

      function dayKey(value) {
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Saratov" }).format(date);
      }

      function visible() {
        var query = document.getElementById("query").value.trim().toLowerCase();
        var stage = stageFilter.value;
        var from = document.getElementById("from").value;
        var to = document.getElementById("to").value;
        return all.filter(function (lead) {
          var day = dayKey(lead.createdAt);
          var haystack = (lead.name + " " + lead.phone + " " + lead.objectType).toLowerCase();
          if (query && haystack.indexOf(query) === -1) return false;
          if (stage && lead.stage !== stage) return false;
          if (from && day < from) return false;
          if (to && day > to) return false;
          return true;
        });
      }

      function draw() {
        var rows = visible();
        var body = document.getElementById("rows");
        body.replaceChildren();
        document.getElementById("empty").hidden = all.length !== 0;
        document.getElementById("none").hidden = all.length === 0 || rows.length !== 0;
        document.getElementById("table-wrap").hidden = rows.length === 0;
        rows.forEach(function (lead) {
          var tr = document.createElement("tr");
          tr.append(cell(sources[lead.source] || lead.source));
          tr.append(cell(when(lead.createdAt)));
          tr.append(cell(lead.name));
          tr.append(cell(lead.phone));
          tr.append(cell(lead.objectType));
          tr.append(cell(stageName(lead.stage)));
          tr.addEventListener("click", function () { openCard(lead.id); });
          body.append(tr);
        });
        if (openId) openCard(openId);
      }

      function openCard(id) {
        var lead = all.find(function (item) { return item.id === id; });
        var card = document.getElementById("card");
        if (!lead) {
          card.hidden = true;
          openId = null;
          return;
        }
        openId = id;
        card.hidden = false;
        document.getElementById("card-name").textContent = lead.name;
        document.getElementById("card-stage").textContent = stageName(lead.stage);
        document.getElementById("card-name-input").value = lead.name;
        document.getElementById("card-phone-input").value = lead.phone;
        document.getElementById("card-object-input").value = lead.objectType;
        document.getElementById("card-source").textContent = sources[lead.source] || lead.source;
        document.getElementById("card-date").textContent = when(lead.createdAt);
        cardStage.value = lead.stage;
        document.getElementById("card-area").value = lead.floorArea == null ? "" : lead.floorArea;
        document.getElementById("card-grade").value = lead.grade || "";
        document.getElementById("card-condition").value = lead.condition || "new";
        document.getElementById("card-package").value = lead.packageCode || "paint";
        var account = document.getElementById("card-account");
        var profile = document.getElementById("card-profile");
        profile.hidden = true;
        profile.removeAttribute("src");
        if (lead.telegram) {
          account.hidden = false;
          document.getElementById("card-first").value = lead.telegram.firstName || "";
          document.getElementById("card-last").value = lead.telegram.lastName || "";
          document.getElementById("card-username").value = lead.telegram.username || "";
          document.getElementById("card-bio").value = lead.telegram.bio || "";
          if (lead.telegram.photo) {
            profile.hidden = false;
            profile.src = "/api/leads/" + id + "/telegram-photo";
          }
        } else {
          account.hidden = true;
        }
        var photos = document.getElementById("card-photos");
        photos.replaceChildren();
        document.getElementById("card-estimate").textContent = "";
        api("/api/leads/" + id).then(function (response) {
          if (response.status !== 200) return null;
          return response.json();
        }).then(function (detail) {
          if (!detail || !detail.estimate) return;
          var estimate = detail.estimate;
          var text = estimate.low + "–" + estimate.high + " ₽, середина " + estimate.middle + " ₽. Работа " + estimate.labor + " ₽, материал " + estimate.material + " ₽. Гарантия " + estimate.warrantyYears + " года. Цена в договоре фиксируется.";
          if (estimate.teaching) text = "Учебный прайс. " + text;
          if (estimate.belowMin) text += " Ниже минимального заказа, менеджер подтверждает выезд.";
          document.getElementById("card-estimate").textContent = text;
        });
        api("/api/leads/" + id + "/photos").then(function (response) {
          if (response.status !== 200) return null;
          return response.json();
        }).then(function (items) {
          if (!items) return;
          items.forEach(function (item) {
            var image = document.createElement("img");
            image.alt = "";
            image.src = "/api/leads/" + id + "/photos/" + item.id;
            photos.append(image);
          });
        });
      }

      function load() {
        api("/api/leads").then(function (response) {
          if (response.status === 401) {
            showDoor();
            return null;
          }
          return response.json();
        }).then(function (rows) {
          if (!rows) return;
          all = rows;
          draw();
        });
      }

      function cell(text) {
        var td = document.createElement("td");
        td.textContent = text;
        return td;
      }

      function when(value) {
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat("ru-RU", {
          timeZone: "Europe/Saratov",
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function loadPrices() {
        api("/api/prices").then(function (response) {
          if (response.status !== 200) return null;
          return response.json();
        }).then(function (prices) {
          if (!prices) return;
          document.getElementById("prices-note").textContent = prices.teaching
            ? prices.note
            : "Прайс компании. Бот считает по нему.";
        });
      }

      api("/api/session").then(function (response) {
        if (response.status === 204) showList();
        else showDoor();
      });

      document.getElementById("admin-login").addEventListener("submit", function (event) {
        event.preventDefault();
        note.textContent = "";
        api("/api/session", {
          method: "POST",
          body: JSON.stringify({ password: document.getElementById("password").value })
        }).then(function (response) {
          if (response.status === 204) {
            document.getElementById("password").value = "";
            showList();
            return;
          }
          note.textContent = "Пароль не подошёл.";
        });
      });

      ["query", "stage-filter", "from", "to"].forEach(function (id) {
        var field = document.getElementById(id);
        field.addEventListener("input", draw);
        field.addEventListener("change", draw);
      });

      document.getElementById("create-open").addEventListener("click", function () {
        var form = document.getElementById("manual");
        form.hidden = !form.hidden;
      });

      document.getElementById("card-close").addEventListener("click", function () {
        openId = null;
        document.getElementById("card").hidden = true;
      });

      document.getElementById("card-form").addEventListener("submit", function (event) {
        event.preventDefault();
        if (!openId) return;
        var area = document.getElementById("card-area").value.trim();
        var body = {
          name: document.getElementById("card-name-input").value,
          phone: document.getElementById("card-phone-input").value,
          objectType: document.getElementById("card-object-input").value,
          stage: cardStage.value,
          floorArea: area === "" ? null : Number(area.replace(",", ".")),
          grade: document.getElementById("card-grade").value || null,
          condition: document.getElementById("card-condition").value,
          packageCode: document.getElementById("card-package").value
        };
        if (!document.getElementById("card-account").hidden) {
          body.telegram = {
            username: document.getElementById("card-username").value,
            firstName: document.getElementById("card-first").value,
            lastName: document.getElementById("card-last").value,
            bio: document.getElementById("card-bio").value
          };
        }
        api("/api/leads/" + openId, { method: "PATCH", body: JSON.stringify(body) }).then(function () { load(); });
      });

      document.getElementById("prices-save").addEventListener("click", function () {
        var file = document.getElementById("prices-file").files[0];
        var note = document.getElementById("prices-note");
        if (!file) return;
        var name = file.name.toLowerCase();
        var done = function (response) {
          note.textContent = response.status === 200
            ? "Прайс записан. Бот прочитает его при следующем расчёте."
            : "Файл не подошёл. Нужны PDF или Excel с названиями работ, либо JSON текущего прайса.";
        };
        if (name.endsWith(".json")) {
          file.text().then(function (text) {
            return api("/api/prices", { method: "PUT", body: text });
          }).then(done);
          return;
        }
        var data = new FormData();
        data.append("file", file);
        fetch("/api/prices", {
          method: "POST",
          credentials: "same-origin",
          headers: { "X-XSRF-TOKEN": csrf() },
          body: data
        }).then(done);
      });

      document.getElementById("manual").addEventListener("submit", function (event) {
        event.preventDefault();
        var manualNote = document.getElementById("manual-note");
        manualNote.textContent = "";
        api("/api/leads", {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("manual-name").value,
            phone: document.getElementById("manual-phone").value,
            objectType: document.getElementById("manual-object").value,
            source: "manual"
          })
        }).then(function (response) {
          if (response.status === 201) {
            document.getElementById("manual").reset();
            load();
            return;
          }
          return response.json().then(function (body) {
            manualNote.textContent = body.error === "phone" ? "Нужен телефон из 10–15 цифр." : "Проверьте поля.";
          });
        });
      });

      logo.addEventListener("click", function (event) {
        if (document.body.classList.contains("in-crm")) event.preventDefault();
      });

      logout.addEventListener("click", function () {
        api("/api/session", { method: "DELETE" }).then(function () {
          showDoor();
        });
      });
    })();
  </script>
</body>
</html>
