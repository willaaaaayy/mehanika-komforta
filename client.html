<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Клиент — Механика Комфорта</title>
  <link rel="icon" href="logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">К содержанию</a>
  <header class="bar">
    <div class="brand">
      <img src="logo.jpg" alt="" width="96" height="96">
      <span>Механика Комфорта</span>
    </div>
    <nav aria-label="Разделы">
      <a href="leads.html">Заявки</a>
      <a href="clients.html">Клиенты</a>
      <a href="finance.html">Финансы</a>
    </nav>
    <button class="btn btn-ghost bar-end" type="button" id="logout">Выйти</button>
  </header>
  <main class="wrap" id="main">
    <p class="banner" id="banner" role="alert" hidden></p>
    <div class="skeleton" id="skeleton" aria-hidden="true"><span></span><span></span></div>
    <article id="card" hidden>
      <header class="lead-bar">
        <div>
          <p class="kicker" id="card-status"></p>
          <h1 id="card-title">Клиент</h1>
        </div>
        <div class="page-actions">
          <button class="btn" type="button" id="unconvert">Вернуть в заявки</button>
          <button class="btn" type="button" id="archive">В архив</button>
        </div>
      </header>
      <div class="tabs" id="tabs" role="tablist">
        <a href="#" data-tab="overview">Обзор</a>
        <a href="#" data-tab="data">Данные</a>
        <a href="#" data-tab="contracts">Договоры</a>
        <a href="#" data-tab="objects">Объекты</a>
        <a href="#" data-tab="finance">Финансы</a>
        <a href="#" data-tab="history">История</a>
      </div>
      <section id="panel-overview" class="panel"></section>
      <section id="panel-data" class="panel" hidden></section>
      <section id="panel-contracts" class="panel" hidden></section>
      <section id="panel-objects" class="panel" hidden></section>
      <section id="panel-finance" class="panel" hidden></section>
      <section id="panel-history" class="panel" hidden></section>
    </article>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/client.js"></script>
</body>
</html>
